name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Create self-signed certificate (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          # Create a temporary keychain
          security create-keychain -p actions temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p actions temp.keychain
          security set-keychain-settings -t 3600 -u temp.keychain
          
          # Generate self-signed certificate
          security add-trusted-cert -d -r trustRoot -k temp.keychain /System/Library/Keychains/SystemRootCertificates.keychain
          
          # Create certificate
          cat > cert.conf <<EOF
          [ req ]
          default_bits       = 2048
          distinguished_name = req_distinguished_name
          req_extensions     = v3_req
          prompt             = no
          
          [ req_distinguished_name ]
          CN = Bitrise Artifacts Developer
          O  = Bitrise Artifacts
          
          [ v3_req ]
          keyUsage = critical, digitalSignature
          extendedKeyUsage = critical, codeSigning
          basicConstraints = critical, CA:false
          EOF
          
          # Generate key and certificate
          openssl req -new -newkey rsa:2048 -nodes -keyout cert.key -out cert.csr -config cert.conf
          openssl x509 -req -days 365 -in cert.csr -signkey cert.key -out cert.crt -extensions v3_req -extfile cert.conf
          openssl pkcs12 -export -out cert.p12 -inkey cert.key -in cert.crt -passout pass:actions
          
          # Import to keychain
          security import cert.p12 -k temp.keychain -P actions -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k actions temp.keychain

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && 'Bitrise Artifacts Developer' || '' }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Bitrise Artifacts {0}', github.ref_name) || '' }}
          releaseBody: 'See the assets below to download the app for your platform.'
          releaseDraft: true
          prerelease: false
          
      - name: Upload artifacts (manual builds)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bitrise-artifacts-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: ignore

  # Separate job for Universal macOS build (Intel + Apple Silicon)
  release-macos-universal:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Create self-signed certificate (macOS Universal)
        run: |
          # Create a temporary keychain
          security create-keychain -p actions temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p actions temp.keychain
          security set-keychain-settings -t 3600 -u temp.keychain
          
          # Generate self-signed certificate
          security add-trusted-cert -d -r trustRoot -k temp.keychain /System/Library/Keychains/SystemRootCertificates.keychain
          
          # Create certificate
          cat > cert.conf <<EOF
          [ req ]
          default_bits       = 2048
          distinguished_name = req_distinguished_name
          req_extensions     = v3_req
          prompt             = no
          
          [ req_distinguished_name ]
          CN = Bitrise Artifacts Developer
          O  = Bitrise Artifacts
          
          [ v3_req ]
          keyUsage = critical, digitalSignature
          extendedKeyUsage = critical, codeSigning
          basicConstraints = critical, CA:false
          EOF
          
          # Generate key and certificate
          openssl req -new -newkey rsa:2048 -nodes -keyout cert.key -out cert.csr -config cert.conf
          openssl x509 -req -days 365 -in cert.csr -signkey cert.key -out cert.crt -extensions v3_req -extfile cert.conf
          openssl pkcs12 -export -out cert.p12 -inkey cert.key -in cert.crt -passout pass:actions
          
          # Import to keychain
          security import cert.p12 -k temp.keychain -P actions -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k actions temp.keychain

      - name: Build Tauri app (Universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: Bitrise Artifacts Developer
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Bitrise Artifacts {0}', github.ref_name) || '' }}
          releaseBody: 'See the assets below to download the app for your platform.'
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin
          
      - name: Upload artifacts (manual builds)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bitrise-artifacts-macos-universal
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
          if-no-files-found: ignore
